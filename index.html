<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Avaliação - Turma 2B</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .glass-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.4);
    }
  </style>
</head>
<body class="p-4 md:p-8 font-sans">

  <!-- Modal de Login / Identificação do Aluno -->
  <div id="modal-login" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
    <div class="glass-card bg-slate-900 p-6 rounded-2xl w-full max-w-md border border-slate-700 shadow-2xl">
      <h2 class="text-2xl font-bold text-slate-100 mb-2 text-center">Identificação do Aluno</h2>
      <p class="text-slate-400 text-xs mb-6 text-center">Selecione o seu nome para acessar o painel de avaliações.</p>
      
      <div class="mb-5">
        <label class="block text-sm font-medium text-slate-300 mb-2">Quem é você?</label>
        <select id="select-aluno-login" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-indigo-500">
          <option value="">-- Selecione seu nome --</option>
        </select>
      </div>

      <button onclick="realizarLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/30">
        Entrar na Sala
      </button>
    </div>
  </div>

  <!-- Interface Principal -->
  <div class="max-w-7xl mx-auto hidden" id="app-container">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4 bg-slate-900/60 p-5 rounded-2xl border border-slate-800">
      <div>
        <h1 class="text-2xl font-extrabold text-indigo-400">Avaliação de Apresentações</h1>
        <p class="text-slate-400 text-xs mt-1">Avaliador logado: <span id="nome-usuario-logado" class="font-bold text-slate-200"></span></p>
      </div>
      <div class="flex items-center gap-4 w-full md:w-auto justify-between">
        <div class="text-right">
          <p class="text-xs text-slate-400">Progresso de Avaliação</p>
          <p class="text-sm font-bold text-indigo-300" id="texto-progresso">0 / 33 colegas</p>
        </div>
        <button onclick="trocarUsuario()" class="text-xs text-slate-400 hover:text-slate-200 bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg">
          Sair
        </button>
      </div>
    </header>

    <main>
      <div id="grid-alunos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </main>
  </div>

  <!-- Modal de Atribuição de Nota -->
  <div id="modal-avaliacao" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass-card bg-slate-900 p-6 rounded-2xl w-full max-w-md border border-slate-700 shadow-2xl relative">
      <h3 class="text-xl font-bold text-slate-100 mb-1" id="modal-nome-aluno">Avaliar Aluno</h3>
      <p class="text-slate-400 text-xs mb-6">Atribua uma nota de 0 a 100 para o colega.</p>

      <form id="form-avaliacao" onsubmit="salvarAvaliacao(event)">
        <input type="hidden" id="modal-aluno-id" />
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-300 mb-2">Nota (0 a 100)</label>
          <input type="number" id="input-nota" min="0" max="100" required placeholder="Ex: 85"
                 class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-2xl font-bold text-indigo-400 focus:outline-none focus:border-indigo-500 text-center" />
        </div>

        <div class="flex gap-3">
          <button type="button" onclick="fecharModal()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3 rounded-xl font-semibold transition">
            Cancelar
          </button>
          <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-xl font-semibold transition shadow-lg shadow-indigo-600/30">
            Confirmar Nota
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB_lWXM50XBj7YWxmYfmagaAcL5vNV8oEk",
      authDomain: "avaliaturma2b.firebaseapp.com",
      databaseURL: "https://avaliaturma2b-default-rtdb.firebaseio.com",
      projectId: "avaliaturma2b",
      storageBucket: "avaliaturma2b.firebasestorage.app",
      messagingSenderId: "420639612042",
      appId: "1:420639612042:web:db98045625b16a54dd6173"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const listaAlunosOficial = [
      "ALEXANDRE ROLIN", "ARTHUR PERUSSOLO", "BEATRIZ SUNTAK", "CAIO COUTINHO",
      "DANIEL NUNES", "DAVI ROBES", "ENDRIO CARDOSO", "ENZO MAURÍCIO",
      "ESTER GABRIELA", "FABIO FECHER", "FELIPE CECILIANO", "GABRIEL PACHECO",
      "GABRIELLY VITORIA", "GIULA PORTELA", "GUILHERME TIMOTEO", "GUSTAVO BACH",
      "HELOISE ANDRADE", "IARA GARRET", "ISABELA WOJAKEVICZ", "JULIA BONATO",
      "KAIO MOCELLIN", "LEONARDO PAIZANI", "LETÍCIA KUCHAKI", "LUCAS WSSNER",
      "LUCAS MELLO", "LUISA CARLOTO", "LUIZ FELIPE", "MATEUS PERIN",
      "MIRELLA GRUBELL", "NICOLAS DE PAULA", "PAULA CORÁ", "TICIANE CHEVA",
      "VINICIUS BARRETO", "VITOR LOFFLER"
    ];

    let alunoLogadoId = localStorage.getItem('alunoLogadoId') || null;
    let estudantesDados = {};

    // Popula select de login
    const selectLogin = document.getElementById('select-aluno-login');
    listaAlunosOficial.forEach((nome, idx) => {
      const opt = document.createElement('option');
      opt.value = idx + 1;
      opt.textContent = nome;
      selectLogin.appendChild(opt);
    });

    db.ref('estudantes').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        let inicial = {};
        listaAlunosOficial.forEach((nome, idx) => {
          inicial[idx + 1] = { id: idx + 1, nome: nome, notas: {} };
        });
        db.ref('estudantes').set(inicial);
        estudantesDados = inicial;
      } else {
        estudantesDados = data;
      }

      if (alunoLogadoId) {
        iniciarSessao();
      }
    });

    function realizarLogin() {
      const selected = selectLogin.value;
      if (!selected) {
        alert("Por favor, selecione seu nome para continuar.");
        return;
      }
      alunoLogadoId = selected;
      localStorage.setItem('alunoLogadoId', alunoLogadoId);
      iniciarSessao();
    }

    function trocarUsuario() {
      localStorage.removeItem('alunoLogadoId');
      alunoLogadoId = null;
      document.getElementById('modal-login').classList.remove('hidden');
      document.getElementById('app-container').classList.add('hidden');
    }

    function iniciarSessao() {
      document.getElementById('modal-login').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      const alunoLogado = estudantesDados[alunoLogadoId];
      document.getElementById('nome-usuario-logado').innerText = alunoLogado ? alunoLogado.nome : '';
      renderizarGrid();
    }

    function renderizarGrid() {
      const grid = document.getElementById('grid-alunos');
      grid.innerHTML = '';

      let avaliadosCount = 0;
      const totalColegas = listaAlunosOficial.length - 1;

      Object.values(estudantesDados).forEach(estudante => {
        const eProprioAluno = (estudante.id == alunoLogadoId);
        
        // Verifica se o aluno logado já avaliou este estudante
        const notasObj = estudante.notas || {};
        const jaAvaliou = !!notasObj[alunoLogadoId];

        if (jaAvaliou && !eProprioAluno) avaliadosCount++;

        const card = document.createElement('div');
        card.className = `glass-card rounded-xl p-5 flex flex-col justify-between ${eProprioAluno ? 'opacity-50' : ''}`;

        let botaoHtml = '';
        if (eProprioAluno) {
          botaoHtml = `<button disabled class="w-full mt-4 bg-slate-800 text-slate-500 py-2 rounded-lg text-xs font-medium cursor-not-allowed border border-slate-800">Você</button>`;
        } else if (jaAvaliou) {
          botaoHtml = `<button disabled class="w-full mt-4 bg-emerald-950/40 border border-emerald-500/30 text-emerald-400 py-2 rounded-lg text-xs font-semibold cursor-not-allowed flex items-center justify-center gap-1">
            <i data-lucide="check" class="w-3.5 h-3.5"></i> Nota Lançada (${notasObj[alunoLogadoId].nota})
          </button>`;
        } else {
          botaoHtml = `<button onclick="abrirModal(${estudante.id})" class="w-full mt-4 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg font-medium text-xs transition border border-indigo-500">
            Atribuir Nota
          </button>`;
        }

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-3">
              <div class="w-9 h-9 rounded-full bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-300 font-bold text-sm">
                ${estudante.nome.charAt(0)}
              </div>
              ${jaAvaliou && !eProprioAluno ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 font-semibold">Concluído</span>' : ''}
            </div>
            <h3 class="text-sm font-bold text-slate-100 mb-1 truncate">${estudante.nome}</h3>
          </div>
          ${botaoHtml}
        `;
        grid.appendChild(card);
      });

      document.getElementById('texto-progresso').innerText = `${avaliadosCount} / ${totalColegas} colegas`;
      lucide.createIcons();
    }

    function abrirModal(id) {
      const estudante = estudantesDados[id];
      if (!estudante) return;

      document.getElementById('modal-aluno-id').value = id;
      document.getElementById('modal-nome-aluno').innerText = `Avaliar ${estudante.nome}`;
      document.getElementById('input-nota').value = '';
      document.getElementById('modal-avaliacao').classList.remove('hidden');
      document.getElementById('modal-avaliacao').classList.add('flex');
    }

    function fecharModal() {
      document.getElementById('modal-avaliacao').classList.add('hidden');
      document.getElementById('modal-avaliacao').classList.remove('flex');
    }

    function salvarAvaliacao(e) {
      e.preventDefault();
      const idAvaliado = document.getElementById('modal-aluno-id').value;
      const nota = parseFloat(document.getElementById('input-nota').value);

      if (isNaN(nota) || nota < 0 || nota > 100) {
        alert('Por favor, digite uma nota válida entre 0 e 100.');
        return;
      }

      const avaliadorNome = estudantesDados[alunoLogadoId].nome;

      // Salva a nota mapeada pela chave do ID do avaliador
      db.ref(`estudantes/${idAvaliado}/notas/${alunoLogadoId}`).set({
        nota: nota,
        avaliadorId: alunoLogadoId,
        avaliadorNome: avaliadorNome,
        data: new Date().toISOString()
      }, (error) => {
        if (error) {
          alert("Erro ao salvar avaliação.");
        } else {
          fecharModal();
        }
      });
    }
  </script>
</body>
</html>
